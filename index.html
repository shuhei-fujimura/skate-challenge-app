<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1d4ed8" />
    <title>全部チャレンジ</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css?v=20260519-2" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div>
          <p class="kicker">Skate Practice</p>
          <h1>全部チャレンジ</h1>
          <p class="hero-message">
            できないのは当たり前、まずはやってみることから始めよう！
            <span id="dailyMessage"></span>
          </p>
        </div>
        <div class="score" aria-label="今日できた数">
          <span id="doneCount">0</span>
          <small>/<span id="totalCount">0</span></small>
        </div>
      </header>

      <main>
        <section class="progress-panel" aria-label="今日の進捗">
          <div class="progress-copy">
            <span id="todayLabel"></span>
            <strong id="remainingLabel">残り 0 技</strong>
          </div>
          <div class="progress-track">
            <div id="progressBar" class="progress-bar"></div>
          </div>
        </section>

        <section class="controls" aria-label="検索と絞り込み">
          <label class="search-box">
            <span>技を検索</span>
            <input id="searchInput" type="search" placeholder="スミス、フリップ、ブラント..." autocomplete="off" />
          </label>
          <div id="kindChips" class="chip-row" aria-label="種類で絞り込み"></div>
          <div id="levelChips" class="chip-row" aria-label="レベルで絞り込み"></div>
        </section>

        <section class="done-panel" aria-label="今日できた技">
          <button id="doneToggle" class="panel-button" type="button">
            <span>今日できた技を見る</span>
            <strong id="donePanelCount">0</strong>
          </button>
          <div id="doneList" class="done-list" hidden></div>
        </section>

        <section id="emptyState" class="empty-state" hidden>
          <h2>全部触れた！</h2>
          <p>今日のチャレンジはかなり良い感じ。できた技一覧で見返せます。</p>
        </section>

        <section id="trickList" class="trick-list" aria-label="残っている技"></section>
      </main>
    </div>

    <template id="trickCardTemplate">
      <article class="trick-card">
        <div class="card-bg"></div>
        <div class="card-content">
          <div class="card-top">
            <span class="number"></span>
            <button class="save-button" type="button" aria-label="あとでまた見る">☆</button>
          </div>
          <h2 class="trick-name"></h2>
          <div class="tag-row">
            <span class="tag kind"></span>
            <span class="tag level"></span>
            <span class="tag target"></span>
          </div>
          <p class="memo"></p>
          <div class="actions">
            <a class="video-button" target="_blank" rel="noreferrer">動画を見る</a>
            <button class="done-button" type="button">できた</button>
          </div>
        </div>
      </article>
    </template>

    <script src="./app.js?v=20260519-2"></script>
  </body>
</html>
